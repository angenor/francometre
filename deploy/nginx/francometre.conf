# Francomètre — vhost à GREFFER sur le nginx d'africans.
#
# ┌─ IMPORTANT ──────────────────────────────────────────────────────────────┐
# │ Copie ces blocs `server {}` DANS le `http {}` du nginx d'africans, et      │
# │ commite-les DANS LE DÉPÔT AFRICANS : le `deploy.sh` d'africans réécrit son │
# │ nginx.conf à chaque déploiement. Un bloc ajouté seulement sur le serveur   │
# │ serait effacé au prochain déploiement d'africans.                          │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Prérequis (posés par `deploy/deploy.sh` de francomètre) :
#   1. Réseau Docker partagé `francometre_net`, auquel uafricas_nginx est attaché.
#   2. Certificat Let's Encrypt de francometre.com copié dans le dossier ssl que
#      monte le nginx d'africans. Les chemins ci-dessous supposent que ce dossier
#      est monté sur /etc/nginx/ssl (cas le plus courant). ADAPTE-LES si le
#      montage d'africans diffère — c'est le seul réglage à vérifier côté nginx.

# ── HTTP → HTTPS (apex + www) ────────────────────────────────────────────────
server {
    listen 80;
    server_name francometre.com www.francometre.com;

    # Défis ACME si un jour tu passes au mode webroot ; inerte sinon.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://francometre.com$request_uri; }
}

# ── www → apex (HTTPS) ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.francometre.com;

    ssl_certificate     /etc/nginx/ssl/francometre-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/francometre-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://francometre.com$request_uri;
}

# ── Site ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name francometre.com;

    ssl_certificate     /etc/nginx/ssl/francometre-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/francometre-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Téléversement de couvertures — au-delà, l'app réduit/refuse de toute façon.
    client_max_body_size 25m;

    # Résolution DYNAMIQUE du conteneur : le DNS embarqué de Docker (127.0.0.11)
    # évite l'IP figée quand le conteneur francometre redémarre (nouvelle IP).
    resolver 127.0.0.11 valid=30s;
    set $francometre_upstream francometre_app:3000;

    location / {
        proxy_pass http://$francometre_upstream;
        proxy_http_version 1.1;
        # Pas de WebSocket sur le site public : on garde le keep-alive amont.
        proxy_set_header Connection        "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_read_timeout 60s;
    }
}
