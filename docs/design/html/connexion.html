<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Francomètre — Connexion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     FRANCOMÈTRE — Connexion (back-office). Bascule : class="dark" sur <html>.
     ============================================================ */
  :root{
    --paper:#FFFFFF; --surface:#F5F5F5; --ink:#0A0A0A;
    --muted:#6F6F6F; --line:#E6E6E6; --accent:#1F35FF;
    --error:#C81E1E;
  }
  html.dark{
    --paper:#0B0B0C; --surface:#151517; --ink:#F5F5F5;
    --muted:#9A9A9A; --line:#262628; --accent:#8A97FF;
    --error:#FF6B6B;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Instrument Sans',sans-serif;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  img{display:block;}
  ::selection{background:var(--accent);color:#FFFFFF;}

  .wm-blanc{display:none;}
  html.dark .wm-noir{display:none;}
  html.dark .wm-blanc{display:block;}

  /* Écran centré */
  .screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
  .login{width:100%;max-width:400px;}
  .login__logo{height:20px;width:auto;margin-bottom:44px;}
  .login__title{font-family:'Archivo',sans-serif;font-weight:700;font-size:32px;line-height:1.05;
                letter-spacing:-.02em;color:var(--ink);margin:0 0 36px;}

  .field{display:block;margin-bottom:28px;}
  .field--last{margin-bottom:32px;}
  .field__label{display:block;font-family:'Archivo',sans-serif;font-weight:600;font-size:11px;
                letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  /* Champ : soulignement d'un filet ordinaire ; focus en 2 px (couleur accent) */
  .field__input{width:100%;font-family:'Instrument Sans',sans-serif;font-size:16px;color:var(--ink);
                background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;
                padding:12px 0;outline:none;transition:border-color 150ms ease;}
  .field__input::placeholder{color:var(--muted);opacity:1;}
  .field__input:focus{border-bottom:2px solid var(--accent);padding-bottom:11px;}

  /* Bouton primaire : noir plein, jamais en accent (survol → accent) */
  .btn-primary{width:100%;height:48px;font-family:'Archivo',sans-serif;font-weight:600;font-size:15px;
               letter-spacing:.01em;color:var(--paper);background:var(--ink);border:0;border-radius:0;
               cursor:pointer;transition:background 150ms ease;}
  .btn-primary:hover{background:var(--accent);}

  .login__error{font-size:13px;line-height:1.4;color:var(--error);margin-top:16px;display:none;}

  /* --- Variante d'état erreur : ajouter class="is-error" sur <form> --- */
  .is-error .field__input{border-bottom:2px solid var(--error);padding-bottom:11px;}
  .is-error .login__error{display:block;}
</style>
</head>

<body>
  <div class="screen">
    <form class="login" action="#" novalidate>
      <img class="login__logo wm-noir" src="../assets/wordmark-noir.png" alt="FRANCOMÈTRE">
      <img class="login__logo wm-blanc" src="../assets/wordmark-blanc.png" alt="FRANCOMÈTRE">

      <h1 class="login__title">Connexion</h1>

      <label class="field">
        <span class="field__label">E-mail</span>
        <input class="field__input" type="email" name="email" placeholder="prenom@exemple.fr" autocomplete="email">
      </label>

      <label class="field field--last">
        <span class="field__label">Mot de passe</span>
        <input class="field__input" type="password" name="password" placeholder="••••••••" autocomplete="current-password">
      </label>

      <button class="btn-primary" type="submit">Se connecter</button>

      <!-- Message d'erreur (affiché quand le formulaire porte la classe is-error) -->
      <p class="login__error">E-mail ou mot de passe incorrect.</p>
    </form>
  </div>
</body>
</html>
